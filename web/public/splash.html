<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>mTRANSLATOR</title>
        <style>
            /* Écran de lancement animé (règle Socle « Splash animé », modèle : splash de mORTEX) :
               les deux pages de l'icône arrivent en 3D, le caractère traduit défile, puis le titre */
            :root {
                --blue-1: #8ab8ff;
                --blue-2: #3b78ec;
                --text: #ffffff;
                --muted: #aaaaaa;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
                font-family:
                    -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            }

            .stage {
                position: absolute;
                inset: 12px;
                perspective: 900px;
            }

            .card {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                gap: 26px;
                padding: 0 30px 0 34px;
                border-radius: 16px;
                overflow: hidden;
                background: linear-gradient(160deg, #34363d 0%, #1b1c21 55%, #121317 100%);
                box-shadow:
                    0 0 0 1px rgb(255 255 255 / 8%) inset,
                    0 10px 24px rgb(0 0 0 / 45%);
                transform-style: preserve-3d;
                animation: card-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* Lueur bleue derrière le logo */
            .card::before {
                content: "";
                position: absolute;
                left: -40px;
                top: 50%;
                width: 240px;
                height: 240px;
                margin-top: -120px;
                background: radial-gradient(circle, rgb(70 130 245 / 24%), transparent 65%);
                opacity: 0;
                animation: glow 1.4s 300ms ease-out forwards;
            }

            /* Reflet qui balaie la carte */
            .card::after {
                content: "";
                position: absolute;
                top: -50%;
                left: -60%;
                width: 40%;
                height: 200%;
                background: linear-gradient(
                    100deg,
                    transparent,
                    rgb(255 255 255 / 10%) 45%,
                    rgb(255 255 255 / 18%) 50%,
                    rgb(255 255 255 / 10%) 55%,
                    transparent
                );
                transform: rotate(8deg) translateX(0);
                animation: sheen 1.1s 1.35s ease-in-out forwards;
            }

            /* ---- Logo : les deux pages de l'icône ---- */
            .logo {
                position: relative;
                flex: 0 0 auto;
                width: 108px;
                height: 108px;
                perspective: 500px;
                transform-style: preserve-3d;
                animation: logo-idle 3.2s 1.6s ease-in-out infinite;
            }

            /* Page d'arrivée, grise, avec le caractère traduit */
            .back {
                position: absolute;
                left: 52px;
                top: 25px;
                width: 52px;
                height: 82px;
                border-radius: 6px;
                background: linear-gradient(160deg, #f1f2f5, #d9dce2);
                box-shadow: 0 4px 10px rgb(0 0 0 / 35%);
                animation: back-in 900ms 250ms cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            .glyph {
                position: absolute;
                left: 14px;
                right: 0;
                top: 22px;
                text-align: center;
                font-size: 28px;
                font-weight: 600;
                line-height: 1;
                color: #5f7380;
                opacity: 0;
                animation: glyph-in 600ms 900ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }

            /* Le caractère défile entre plusieurs écritures, comme une traduction en cours */
            .glyph.g1 {
                animation:
                    glyph-in 600ms 900ms cubic-bezier(0.34, 1.56, 0.64, 1) both,
                    cycle-1 3.6s 1.6s ease-in-out infinite;
            }
            .glyph.g2 {
                animation: cycle-2 3.6s 1.6s ease-in-out infinite;
            }
            .glyph.g3 {
                animation: cycle-3 3.6s 1.6s ease-in-out infinite;
            }

            /* Page de départ, bleue, avec le M ; elle pivote depuis son bord gauche */
            .front {
                position: absolute;
                left: 2px;
                top: 5px;
                width: 73px;
                height: 83px;
                transform-origin: left center;
                filter: drop-shadow(0 4px 8px rgb(0 0 0 / 40%));
                animation: front-in 1.2s 100ms cubic-bezier(0.34, 1.3, 0.5, 1) both;
            }

            .front .sheet {
                position: absolute;
                inset: 0;
                border-radius: 7px 0 0 7px;
                background: linear-gradient(160deg, #5b9bff, #3b78ec);
                clip-path: polygon(0 0, 63.7% 0, 100% 100%, 0 100%);
            }

            .front .letter {
                position: absolute;
                left: 0;
                width: 59px;
                top: 23px;
                text-align: center;
                font-size: 38px;
                font-weight: 700;
                line-height: 1;
                color: #ffffff;
            }

            /* Pli de la page bleue sous la page grise */
            .fold {
                position: absolute;
                left: 52px;
                top: 88px;
                width: 23px;
                height: 19px;
                background: #3f4fc0;
                clip-path: polygon(0 0, 100% 0, 25% 100%);
                transform-origin: top center;
                animation: fold-in 500ms 1s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ---- Titre ---- */
            .text {
                position: relative;
                flex: 1 1 auto;
                min-width: 0;
                transform-style: preserve-3d;
            }

            .title {
                display: flex;
                margin: 0;
                font-size: 34px;
                font-weight: 800;
                line-height: 1;
                letter-spacing: 0.3px;
                color: var(--text);
                perspective: 400px;
            }

            .title span {
                display: inline-block;
                transform-origin: 50% 85%;
                animation: letter-in 700ms cubic-bezier(0.2, 1.2, 0.4, 1) both;
                animation-delay: calc(450ms + var(--i) * 45ms);
            }

            .title .m {
                background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .rule {
                height: 2px;
                margin: 10px 0 9px;
                border-radius: 1px;
                background: linear-gradient(90deg, var(--blue-1), var(--blue-2) 60%, transparent);
                transform-origin: left center;
                animation: rule-in 700ms 950ms cubic-bezier(0.65, 0, 0.35, 1) both;
            }

            .subtitle {
                margin: 0;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 3.5px;
                color: #d8d8d8;
                white-space: nowrap;
                animation: subtitle-in 900ms 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            .footer {
                position: absolute;
                right: 18px;
                bottom: 10px;
                font-size: 9.5px;
                font-weight: 500;
                letter-spacing: 0.6px;
                color: var(--muted);
                text-transform: uppercase;
                animation: fade-in 600ms 1.5s ease-out both;
            }

            /* Sortie : zoom arrière avec rebond (easeInBack) — la carte gonfle un peu puis se replie */
            body.leaving .stage {
                animation: leave 600ms cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
            }

            @keyframes leave {
                from {
                    opacity: 1;
                    transform: scale(1);
                }
                70% {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                    transform: scale(0.05);
                }
            }

            @keyframes card-in {
                from {
                    opacity: 0;
                    transform: rotateX(28deg) rotateY(-14deg) translateZ(-120px) scale(0.92);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes glow {
                to {
                    opacity: 1;
                }
            }

            @keyframes sheen {
                to {
                    transform: rotate(8deg) translateX(520%);
                }
            }

            @keyframes front-in {
                from {
                    opacity: 0;
                    transform: rotateY(-110deg) translateZ(40px) scale(0.6);
                }
                35% {
                    opacity: 1;
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes back-in {
                from {
                    opacity: 0;
                    transform: translateX(34px) rotateY(50deg) scale(0.7);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes fold-in {
                from {
                    transform: scaleY(0);
                }
                to {
                    transform: scaleY(1);
                }
            }

            @keyframes glyph-in {
                from {
                    opacity: 0;
                    transform: scale(0.2) rotate(-30deg);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes cycle-1 {
                0%,
                28% {
                    opacity: 1;
                    transform: none;
                }
                34%,
                94% {
                    opacity: 0;
                    transform: translateY(-8px) scale(0.8);
                }
                100% {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes cycle-2 {
                0%,
                28% {
                    opacity: 0;
                    transform: translateY(8px) scale(0.8);
                }
                34%,
                61% {
                    opacity: 1;
                    transform: none;
                }
                67%,
                100% {
                    opacity: 0;
                    transform: translateY(-8px) scale(0.8);
                }
            }

            @keyframes cycle-3 {
                0%,
                61% {
                    opacity: 0;
                    transform: translateY(8px) scale(0.8);
                }
                67%,
                94% {
                    opacity: 1;
                    transform: none;
                }
                100% {
                    opacity: 0;
                    transform: translateY(-8px) scale(0.8);
                }
            }

            /* Respiration du logo au repos */
            @keyframes logo-idle {
                0%,
                100% {
                    transform: none;
                }
                50% {
                    transform: rotateY(-12deg) rotateX(6deg) translateY(-2px);
                }
            }

            @keyframes letter-in {
                from {
                    opacity: 0;
                    transform: rotateX(-95deg) translateY(14px);
                    filter: blur(3px);
                }
                to {
                    opacity: 1;
                    transform: none;
                    filter: none;
                }
            }

            @keyframes rule-in {
                from {
                    transform: scaleX(0);
                }
                to {
                    transform: scaleX(1);
                }
            }

            @keyframes subtitle-in {
                from {
                    opacity: 0;
                    letter-spacing: 10px;
                    filter: blur(4px);
                }
                to {
                    opacity: 1;
                    letter-spacing: 3.5px;
                    filter: none;
                }
            }

            @keyframes fade-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            /* Splash fixe : tout est posé d'emblée, mêmes durées d'affichage */
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 1ms !important;
                    animation-delay: 0ms !important;
                    animation-iteration-count: 1 !important;
                }
                .glyph.g2,
                .glyph.g3 {
                    animation: none !important;
                    opacity: 0;
                }
            }
        </style>
    </head>

    <body>
        <div class="stage">
            <div class="card">
                <div class="logo" aria-hidden="true">
                    <div class="back">
                        <div class="glyph g1">文</div>
                        <div class="glyph g2">A</div>
                        <div class="glyph g3">Я</div>
                    </div>
                    <div class="fold"></div>
                    <div class="front">
                        <div class="sheet"></div>
                        <div class="letter">M</div>
                    </div>
                </div>

                <div class="text">
                    <h1 class="title" aria-label="mTRANSLATOR">
                        <span class="m" style="--i: 0">m</span>
                        <span style="--i: 1">T</span>
                        <span style="--i: 2">R</span>
                        <span style="--i: 3">A</span>
                        <span style="--i: 4">N</span>
                        <span style="--i: 5">S</span>
                        <span style="--i: 6">L</span>
                        <span style="--i: 7">A</span>
                        <span style="--i: 8">T</span>
                        <span style="--i: 9">O</span>
                        <span style="--i: 10">R</span>
                    </h1>
                    <div class="rule"></div>
                    <p class="subtitle" id="subtitle"></p>
                </div>

                <div class="footer" id="footer"></div>
            </div>
        </div>

        <script>
            // Textes du splash dans les 4 langues (mêmes clés) ; anglais si la langue n'en fait pas partie
            const TEXTS = {
                fr: { subtitle: "TRADUCTEUR DE MODS" },
                en: { subtitle: "MOD TRANSLATOR" },
                es: { subtitle: "TRADUCTOR DE MODS" },
                it: { subtitle: "TRADUTTORE DI MOD" },
            };
            const params = new URL(window.location.href).searchParams;
            const lang = (params.get("lang") || navigator.language || "en").slice(0, 2).toLowerCase();
            document.documentElement.lang = TEXTS[lang] ? lang : "en";
            document.getElementById("subtitle").textContent = (TEXTS[lang] || TEXTS.en).subtitle;
            const version = params.get("v");
            if (version) document.getElementById("footer").textContent = "v" + version;

            // Appelée par l'appli (evaluate_js) au début de la sortie animée
            window.splashLeave = () => document.body.classList.add("leaving");
        </script>
    </body>
</html>
