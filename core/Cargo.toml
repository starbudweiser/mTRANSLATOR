[package]
name = "xtcore"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Cœur de traduction mTRANSLATOR : portage Rust des formats et de l'heuristique de xTranslator (McGuffin, MPL-2.0)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtcore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
fancy-regex = "0.13"
flate2 = "1"
lz4_flex = "0.11"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
