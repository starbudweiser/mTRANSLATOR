<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>mTRANSLATOR</title>
        <style>
            /* Écran de lancement animé (règle Socle « Splash animé », modèle : splash de mORTEX) :
               les deux pages de l'icône arrivent en 3D, puis le titre ; à plat, sans ombre, halo ni dégradé (Socle) */
            :root {
                --blue-1: #5b9bff;
                --blue-2: #3b78ec;
                --text: #ffffff;
                --muted: #aaaaaa;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
                font-family:
                    -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            }

            .stage {
                position: absolute;
                inset: 12px;
                perspective: 900px;
            }

            .card {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                /* écart réduit : le nom (40px fixe) tient entre les marges de 24px */
                gap: 18px;
                /* marge identique des deux côtés (Socle space-6) */
                padding: 0 24px;
                border-radius: 16px;
                overflow: hidden;
                background: #1b1c21;
                border: 1px solid rgb(255 255 255 / 8%);
                transform-style: preserve-3d;
                animation: card-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* ---- Logo : les deux pages de l'icône ---- */
            .logo {
                position: relative;
                flex: 0 0 auto;
                width: 108px;
                height: 108px;
                perspective: 500px;
                transform-style: preserve-3d;
            }

            /* Page d'arrivée, grise, avec le caractère traduit */
            .back {
                position: absolute;
                left: 52px;
                top: 25px;
                width: 52px;
                height: 82px;
                border-radius: 6px;
                background: #e6e8ec;
                animation: back-in 900ms 250ms cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            .glyph {
                position: absolute;
                left: 14px;
                right: 0;
                top: 22px;
                text-align: center;
                font-size: 28px;
                font-weight: 600;
                line-height: 1;
                color: #5f7380;
                opacity: 0;
                animation: glyph-in 600ms 900ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }

            /* Page de départ, bleue, avec le M ; elle pivote depuis son bord gauche */
            .front {
                position: absolute;
                left: 2px;
                top: 5px;
                width: 73px;
                height: 83px;
                transform-origin: left center;
                animation: front-in 1.2s 100ms cubic-bezier(0.34, 1.3, 0.5, 1) both;
            }

            .front .sheet {
                position: absolute;
                inset: 0;
                border-radius: 7px 0 0 7px;
                background: #3b78ec;
                clip-path: polygon(0 0, 63.7% 0, 100% 100%, 0 100%);
            }

            .front .letter {
                position: absolute;
                left: 0;
                width: 59px;
                top: 23px;
                text-align: center;
                font-size: 38px;
                font-weight: 700;
                line-height: 1;
                color: #ffffff;
            }

            /* Pli de la page bleue sous la page grise */
            .fold {
                position: absolute;
                left: 52px;
                top: 88px;
                width: 23px;
                height: 19px;
                background: #3f4fc0;
                clip-path: polygon(0 0, 100% 0, 25% 100%);
                transform-origin: top center;
                animation: fold-in 500ms 1s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ---- Titre ---- */
            .text {
                position: relative;
                flex: 0 1 auto;
                min-width: 0;
                transform-style: preserve-3d;
            }

            .title {
                display: flex;
                margin: 0;
                /* taille fixe commune aux splashs (Socle size-splash-title) */
                font-size: 40px;
                font-weight: 800;
                line-height: 1;
                letter-spacing: 0.5px;
                color: var(--text);
                perspective: 400px;
            }

            .title span {
                display: inline-block;
                transform-origin: 50% 85%;
                animation: letter-in 700ms cubic-bezier(0.2, 1.2, 0.4, 1) both;
                animation-delay: calc(450ms + var(--i) * 45ms);
            }

            .title .m {
                color: var(--blue-1);
            }

            .rule {
                height: 2px;
                margin: 10px 0 9px;
                border-radius: 1px;
                background: var(--blue-2);
                transform-origin: left center;
                animation: rule-in 700ms 950ms cubic-bezier(0.65, 0, 0.35, 1) both;
            }

            .subtitle {
                margin: 0;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 3.5px;
                color: #d8d8d8;
                white-space: nowrap;
                animation: subtitle-in 900ms 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            .footer {
                position: absolute;
                right: 24px;
                bottom: 10px;
                font-size: 9.5px;
                font-weight: 500;
                letter-spacing: 0.6px;
                color: var(--muted);
                text-transform: uppercase;
                animation: fade-in 600ms 1.5s ease-out both;
            }

            /* Sortie : zoom arrière avec rebond (easeInBack) — la carte gonfle un peu puis se replie */
            body.leaving .stage {
                animation: leave 600ms cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
            }

            @keyframes leave {
                from {
                    opacity: 1;
                    transform: scale(1);
                }
                70% {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                    transform: scale(0.05);
                }
            }

            @keyframes card-in {
                from {
                    opacity: 0;
                    transform: rotateX(28deg) rotateY(-14deg) translateZ(-120px) scale(0.92);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes front-in {
                from {
                    opacity: 0;
                    transform: rotateY(-110deg) translateZ(40px) scale(0.6);
                }
                35% {
                    opacity: 1;
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes back-in {
                from {
                    opacity: 0;
                    transform: translateX(34px) rotateY(50deg) scale(0.7);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes fold-in {
                from {
                    transform: scaleY(0);
                }
                to {
                    transform: scaleY(1);
                }
            }

            @keyframes glyph-in {
                from {
                    opacity: 0;
                    transform: scale(0.2) rotate(-30deg);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes letter-in {
                from {
                    opacity: 0;
                    transform: rotateX(-95deg) translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes rule-in {
                from {
                    transform: scaleX(0);
                }
                to {
                    transform: scaleX(1);
                }
            }

            @keyframes subtitle-in {
                from {
                    opacity: 0;
                    letter-spacing: 10px;
                }
                to {
                    opacity: 1;
                    letter-spacing: 3.5px;
                }
            }

            @keyframes fade-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            body.measure * {
                animation: none !important;
            }

            /* Splash fixe : tout est posé d'emblée, mêmes durées d'affichage */
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 1ms !important;
                    animation-delay: 0ms !important;
                    animation-iteration-count: 1 !important;
                }
            }
        </style>
    </head>

    <body>
        <div class="stage">
            <div class="card">
                <div class="logo" aria-hidden="true">
                    <div class="back">
                        <div class="glyph">文</div>
                    </div>
                    <div class="fold"></div>
                    <div class="front">
                        <div class="sheet"></div>
                        <div class="letter">M</div>
                    </div>
                </div>

                <div class="text">
                    <h1 class="title" aria-label="mTRANSLATOR">
                        <span class="m" style="--i: 0">m</span>
                        <span style="--i: 1">T</span>
                        <span style="--i: 2">R</span>
                        <span style="--i: 3">A</span>
                        <span style="--i: 4">N</span>
                        <span style="--i: 5">S</span>
                        <span style="--i: 6">L</span>
                        <span style="--i: 7">A</span>
                        <span style="--i: 8">T</span>
                        <span style="--i: 9">O</span>
                        <span style="--i: 10">R</span>
                    </h1>
                    <div class="rule"></div>
                    <p class="subtitle" id="subtitle"></p>
                </div>

                <div class="footer" id="footer"></div>
            </div>
        </div>

        <script>
            // Textes du splash dans les 4 langues (mêmes clés) ; anglais si la langue n'en fait pas partie
            const TEXTS = {
                fr: { subtitle: "TRADUCTEUR DE MODS" },
                en: { subtitle: "MOD TRANSLATOR" },
                es: { subtitle: "TRADUCTOR DE MODS" },
                it: { subtitle: "TRADUTTORE DI MOD" },
            };
            const params = new URL(window.location.href).searchParams;
            const lang = (params.get("lang") || navigator.language || "en").slice(0, 2).toLowerCase();
            document.documentElement.lang = TEXTS[lang] ? lang : "en";
            document.getElementById("subtitle").textContent = (TEXTS[lang] || TEXTS.en).subtitle;
            const version = params.get("v");
            if (version) document.getElementById("footer").textContent = "v" + version;

            // Largeur du bloc titre mesurée sans animation (le sous-titre arrive très espacé) ;
            // le nom garde sa taille fixe, seul un sous-titre trop long est réduit
            const text = document.querySelector(".text");
            const title = document.querySelector(".title");
            const subtitle = document.getElementById("subtitle");
            const fit = () => {
                document.body.classList.add("measure");
                const room = document.querySelector(".card").clientWidth - 48 - 108 - 18;
                let sub = parseFloat(getComputedStyle(subtitle).fontSize);
                while (subtitle.scrollWidth > room && sub > 8) subtitle.style.fontSize = --sub + "px";
                text.style.width = Math.min(room, Math.max(title.scrollWidth, subtitle.scrollWidth)) + "px";
                document.body.classList.remove("measure");
            };
            fit();
            document.fonts && document.fonts.ready.then(fit);

            // Appelée par l'appli (evaluate_js) au début de la sortie animée
            window.splashLeave = () => document.body.classList.add("leaving");
        </script>
    </body>
</html>
